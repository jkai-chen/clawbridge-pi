name: release

# Builds pi-ai and pi-agent-core from a cb-* tag and attaches the npm tarballs, with their
# SHA-256, to a GitHub Release. ClawBridge pins those tarball URLs with lockfile integrity.
on:
  push:
    tags: ["cb-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.20.0
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run check
      - run: npm run check:strip
      - run: npm test
      - name: Pack
        run: |
          mkdir -p out
          npm pack --workspace packages/ai --workspace packages/agent --pack-destination out
          (cd out && sha256sum *.tgz > SHA256SUMS && cat SHA256SUMS)
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" out/*.tgz out/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "Built from $TAG ($GITHUB_SHA). See NOTICE.md for what this fork removes."
